<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6d4aff">
<title>购物审批</title>
<style>
:root{--bg:#f7f7fb;--card:#fff;--text:#17171c;--muted:#777681;--line:#e9e8ee;--p:#6d4aff;--green:#19a85a;--orange:#ef7d24;--red:#e84a4a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}.app{max-width:520px;margin:auto;min-height:100vh;padding:22px 18px 92px}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}h1{font-size:28px;margin:0}.sub,.muted{color:var(--muted);font-size:13px}.plus{width:46px;height:46px;border:0;border-radius:15px;background:#fff;color:var(--p);font-size:28px;box-shadow:0 8px 30px #1f184011}.tabs{display:flex;border-bottom:1px solid var(--line);overflow:auto}.tabs button{border:0;background:none;padding:10px 11px;color:var(--muted);white-space:nowrap}.tabs .on{color:var(--p);font-weight:800;border-bottom:2px solid var(--p)}.card{background:#fff;border-radius:18px;padding:14px;margin-top:12px;box-shadow:0 8px 30px #1f184011}.row{display:flex;gap:12px}.thumb{width:92px;height:110px;object-fit:cover;border-radius:14px;background:#eee}.grow{flex:1;min-width:0}.head{display:flex;justify-content:space-between;gap:8px}.name{font-weight:800}.price{color:var(--orange);font-weight:850}.reason{color:#5f5d67;font-size:13px;line-height:1.55;margin:7px 0}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.btn{border:0;border-radius:14px;min-height:46px;padding:0 16px;font-weight:800}.primary{background:var(--p);color:#fff}.secondary{background:#efedff;color:var(--p)}.danger{background:#fff;color:var(--red);border:1px solid #ffbcbc}.approve{background:var(--green);color:#fff}.banner{background:#f0edff;border-radius:18px;padding:16px;margin:12px 0}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#fffe;padding:9px 12px max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);backdrop-filter:blur(16px)}.nav button{border:0;background:none;color:#85838e;padding:7px}.nav .on{color:var(--p);font-weight:800}.modal-bg{position:fixed;inset:0;background:#0e0c1866;display:flex;align-items:flex-end;justify-content:center;z-index:50}.modal{width:min(520px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:20px 18px 28px}.modal h2{margin:0 0 8px}.field{margin:13px 0}.field label{display:block;font-weight:800;font-size:14px;margin-bottom:6px}.input,.textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 14px;outline:none}.textarea{min-height:105px}.full{width:100%}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slot{aspect-ratio:1;border:1.5px dashed #c8c5d2;border-radius:14px;background:#fff;display:grid;place-items:center;overflow:hidden;position:relative;font-size:28px;color:var(--p)}.slot img{width:100%;height:100%;object-fit:cover}.x{position:absolute;right:5px;top:5px;border:0;border-radius:50%;background:#0009;color:#fff;width:25px;height:25px}.empty{text-align:center;padding:70px 20px;color:var(--muted)}.setting{display:flex;justify-content:space-between;align-items:center;gap:10px}.code{letter-spacing:4px;font-size:22px;color:var(--p);font-weight:900}.status-pending{color:var(--orange)}.status-approved{color:var(--green)}.status-rejected{color:var(--red)}.status-purchased{color:var(--p)}.onboard{min-height:100vh;display:grid;place-items:center;padding:22px}.onboard .box{background:#fff;border-radius:28px;padding:28px 22px;width:min(480px,100%);box-shadow:0 8px 30px #1f184011}.choices{display:grid;gap:10px;margin-top:20px}.choice{text-align:left;border:1px solid var(--line);background:#fff;border-radius:16px;padding:16px}.choice strong{display:block}.note{background:#fff8eb;color:#85541d;border-radius:14px;padding:12px;font-size:12px;line-height:1.5;margin-top:12px}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#24232a;color:#fff;padding:11px 14px;border-radius:13px;z-index:99}
</style>
</head><body><div id="root"></div><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const CFG='shopping-approval-config',DEMO='shopping-approval-demo-v2';let supabase=null,state={user:null,room:null,requests:[],tab:'mine',filter:'all'},files=[];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'¥'+Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:2}),now=()=>new Date().toISOString(),uid=()=>crypto.randomUUID(),code=()=>Array.from({length:6},()=> 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)}function cfg(){try{return JSON.parse(localStorage.getItem(CFG)||'null')}catch{return null}}function demo(){try{return JSON.parse(localStorage.getItem(DEMO)||'null')||{user:null,room:null,requests:[]}}catch{return{user:null,room:null,requests:[]}}}function saveDemo(d){localStorage.setItem(DEMO,JSON.stringify(d))}function status(s){return({pending:'等待审批',approved:'已通过',rejected:'已驳回',purchased:'已购买'})[s]||s}function date(s){return new Date(s).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
async function init(){let c=cfg();if(c?.url&&c?.key){supabase=createClient(c.url,c.key);let{data}=await supabase.auth.getSession();let u=data.session?.user;if(!u){let a=await supabase.auth.signInAnonymously();if(a.error)throw a.error;u=a.data.user}let{data:p}=await supabase.from('profiles').select('id,nickname').eq('id',u.id).maybeSingle();state.user=p;let{data:m}=await supabase.from('room_members').select('room_id,rooms!inner(id,code,name)').eq('user_id',u.id).maybeSingle();state.room=m?.rooms||null}else{let d=demo();state.user=d.user;state.room=d.room}if(state.user&&state.room)await refresh();render()}
async function refresh(){if(supabase){let{data,error}=await supabase.from('purchase_requests').select('*').order('created_at',{ascending:false});if(error)throw error;for(let r of data||[]){let out=[];for(let p of r.images||[]){let{data:s}=await supabase.storage.from('product-images').createSignedUrl(p,86400);out.push(s?.signedUrl||'')}r._images=out}state.requests=data||[]}else state.requests=demo().requests||[]}
function render(){if(!state.user||!state.room)return onboarding();let n=state.requests.filter(r=>r.submitter_id!==state.user.id&&r.status==='pending').length;$('#root').innerHTML=`<div class="app">${state.tab==='mine'?mine():state.tab==='approval'?approval():settings()}</div><nav class="nav"><button class="${state.tab==='mine'?'on':''}" data-tab="mine">▣<br>我的申请</button><button class="${state.tab==='approval'?'on':''}" data-tab="approval">✓${n?' '+n:''}<br>待我审批</button><button class="${state.tab==='settings'?'on':''}" data-tab="settings">♙<br>我的</button></nav>`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>detail(b.dataset.detail));document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>decide(b.dataset.approve,'approved'));document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>reject(b.dataset.reject));$('#add')?.addEventListener('click',addForm);$('#cloud')?.addEventListener('click',cloud);$('#copy')?.addEventListener('click',async()=>{await navigator.clipboard.writeText(state.room.code);toast('邀请码已复制')});$('#logout')?.addEventListener('click',async()=>{if(supabase)await supabase.auth.signOut();else localStorage.removeItem(DEMO);location.reload()})}
function mine(){let all=state.requests.filter(r=>r.submitter_id===state.user.id),list=state.filter==='all'?all:all.filter(r=>r.status===state.filter);return`<div class="top"><div><h1>我的申请</h1><div class="sub">我提交的，等待朋友审批</div></div><button class="plus" id="add">＋</button></div><div class="tabs">${[['all','全部'],['pending','待审批'],['approved','已通过'],['rejected','已驳回']].map(x=>`<button class="${state.filter===x[0]?'on':''}" data-f="${x[0]}">${x[1]}</button>`).join('')}</div>${list.length?list.map(card).join(''):'<div class="empty">还没有申请<br><small>点右上角＋提交想买的东西</small></div>'}`}
function card(r){let img=(r._images||r.images||[])[0]||'';return`<div class="card" data-detail="${r.id}"><div class="row">${img?`<img class="thumb" src="${esc(img)}">`:''}<div class="grow"><div class="head"><div class="name">${esc(r.product_name)}</div><div class="price">${money(r.price)}</div></div><div class="reason">${esc(r.reason)}</div><div class="meta"><span class="status-${r.status}">${status(r.status)}</span><span>${date(r.created_at)}</span></div></div></div></div>`}
function approval(){let p=state.requests.filter(r=>r.submitter_id!==state.user.id&&r.status==='pending');return`<div class="top"><div><h1>待我审批</h1><div class="sub">朋友提交的，等你来决定</div></div></div>${p.length?p.map(r=>{let img=(r._images||r.images||[])[0]||'';return`<div class="card"><div class="row" data-detail="${r.id}">${img?`<img class="thumb" src="${esc(img)}">`:''}<div class="grow"><div class="head"><div><div class="name">${esc(r.product_name)}</div><div class="muted">${esc(r.submitter_nickname||'朋友')}想买</div></div><div class="price">${money(r.price)}</div></div><div class="reason">“${esc(r.reason)}”</div></div></div><div class="actions"><button class="btn danger" data-reject="${r.id}">× 驳回</button><button class="btn approve" data-approve="${r.id}">✓ 通过</button></div></div>`}).join(''):'<div class="empty">没有待审批的东西</div>'}`}
function settings(){return`<div class="top"><div><h1>我的</h1><div class="sub">${esc(state.room.name)}</div></div></div><div class="card setting"><div><b>${esc(state.user.nickname)}</b><div class="muted">你的昵称</div></div></div><div class="card setting"><div><b>房间邀请码</b><div class="code">${esc(state.room.code)}</div></div><button class="btn secondary" id="copy">复制</button></div><div class="card setting"><div><b>云端连接</b><div class="muted">${supabase?'已连接，两台设备可同步':'本地演示，仅当前设备'}</div></div><button class="btn secondary" id="cloud">设置</button></div><div class="card setting"><div><b>退出当前房间</b></div><button class="btn danger" id="logout">退出</button></div>`}
function onboarding(){$('#root').innerHTML=`<div class="onboard"><div class="box"><h1>两个人的购物审批</h1><p class="muted">把想买的东西交给朋友判断。</p>${cfg()?'':'<div class="note">当前为本地演示模式。两台设备同步需要先设置 Supabase。</div>'}<div class="choices"><button class="choice" id="create"><strong>创建购物房间</strong><span class="muted">创建后把 6 位邀请码发给朋友</span></button><button class="choice" id="join"><strong>加入购物房间</strong><span class="muted">输入朋友的邀请码</span></button><button class="choice" id="cloud"><strong>云端设置</strong><span class="muted">连接 Supabase</span></button></div></div></div>`;$('#create').onclick=()=>roomForm(true);$('#join').onclick=()=>roomForm(false);$('#cloud').onclick=cloud}
function roomForm(create){modal(`<h2>${create?'创建购物房间':'加入购物房间'}</h2><div class="field"><label>你的昵称</label><input class="input" id="nick"></div>${create?'<div class="field"><label>房间名称</label><input class="input" id="rname" value="我和朋友的购物审批"></div>':'<div class="field"><label>邀请码</label><input class="input" id="rcode" maxlength="6"></div>'}<button class="btn primary full" id="go">${create?'创建':'加入'}</button>`);$('#go').onclick=async()=>{let nick=$('#nick').value.trim();if(!nick)return toast('请输入昵称');try{if(supabase){let fn=create?'create_room':'join_room',args=create?{p_nickname:nick,p_room_name:$('#rname').value.trim(),p_code:code()}:{p_nickname:nick,p_code:$('#rcode').value.trim().toUpperCase()};let{data,error}=await supabase.rpc(fn,args);if(error)throw error;let{data:s}=await supabase.auth.getSession();state.user={id:s.session.user.id,nickname:nick};state.room=data}else{let d=demo();if(create){state.user={id:uid(),nickname:nick};state.room={id:uid(),code:code(),name:$('#rname').value.trim()};d={user:state.user,room:state.room,requests:[]}}else throw Error('本地演示不能跨设备加入，请先设置 Supabase');saveDemo(d)}$('.modal-bg').remove();await refresh();render()}catch(e){toast(e.message)}}}
function addForm(){files=[];modal(`<h2>添加想买的东西</h2><div class="field"><label>商品图片 *</label><div class="grid" id="pics"><button class="slot" id="pick">＋</button></div><input id="file" type="file" accept="image/*" multiple hidden></div><div class="field"><label>商品名称 *</label><input class="input" id="pname"></div><div class="field"><label>价格 *</label><input class="input" id="price" inputmode="decimal"></div><div class="field"><label>为什么想买？ *</label><textarea class="textarea" id="reason"></textarea></div><div class="field"><label>商品链接（可选）</label><input class="input" id="link"></div><button class="btn primary full" id="submit">提交给朋友审批</button>`);$('#pick').onclick=()=>$('#file').click();$('#file').onchange=e=>{files=[...e.target.files].slice(0,3);drawPics()};$('#submit').onclick=submitReq}
function drawPics(){let p=$('#pics');p.innerHTML=files.map((f,i)=>`<div class="slot"><img src="${URL.createObjectURL(f)}"><button class="x" data-x="${i}">×</button></div>`).join('')+(files.length<3?'<button class="slot" id="pick">＋</button>':'');$('#pick')?.addEventListener('click',()=>$('#file').click());document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{files.splice(+b.dataset.x,1);drawPics()})}
async function submitReq(){let name=$('#pname').value.trim(),price=Number($('#price').value),reason=$('#reason').value.trim(),link=$('#link').value.trim();if(!files.length||!name||!Number.isFinite(price)||!reason)return toast('请把图片、名称、价格和理由填完整');try{let id=uid(),paths=[];if(supabase){for(let f of files){let ext=(f.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'');let path=`${state.room.id}/${id}-${uid()}.${ext}`;let{error}=await supabase.storage.from('product-images').upload(path,f);if(error)throw error;paths.push(path)}let payload={id,room_id:state.room.id,submitter_id:state.user.id,submitter_nickname:state.user.nickname,product_name:name,price,reason,link:link||null,images:paths,status:'pending'};let{error}=await supabase.from('purchase_requests').insert(payload);if(error)throw error}else{let d=demo();let imgs=await Promise.all(files.map(f=>new Promise(res=>{let r=new FileReader;r.onload=()=>res(r.result);r.readAsDataURL(f)})));d.requests.unshift({id,room_id:state.room.id,submitter_id:state.user.id,submitter_nickname:state.user.nickname,product_name:name,price,reason,link,images:imgs,status:'pending',created_at:now()});saveDemo(d)}$('.modal-bg').remove();toast('已提交');await refresh();render()}catch(e){toast(e.message)}}
async function decide(id,s){try{if(supabase){let{error}=await supabase.from('purchase_requests').update({status:s,decided_at:now()}).eq('id',id);if(error)throw error}else{let d=demo(),r=d.requests.find(x=>x.id===id);r.status=s;saveDemo(d)}toast('已通过');await refresh();render()}catch(e){toast(e.message)}}
function reject(id){modal(`<h2>为什么不建议买？</h2><textarea class="textarea" id="rr" placeholder="例如：太贵了、已经有类似的"></textarea><button class="btn danger full" id="rgo">确认驳回</button>`);$('#rgo').onclick=async()=>{let reason=$('#rr').value.trim();if(!reason)return toast('写一句原因');try{if(supabase){let{error}=await supabase.from('purchase_requests').update({status:'rejected',reject_reason:reason,decided_at:now()}).eq('id',id);if(error)throw error}else{let d=demo(),r=d.requests.find(x=>x.id===id);r.status='rejected';r.reject_reason=reason;saveDemo(d)}$('.modal-bg').remove();toast('已驳回');await refresh();render()}catch(e){toast(e.message)}}}
function detail(id){let r=state.requests.find(x=>x.id===id);if(!r)return;modal(`<h2>${esc(r.product_name)}</h2><div class="price">${money(r.price)}</div><p>${esc(r.reason)}</p>${r.reject_reason?`<div class="banner">朋友意见：${esc(r.reject_reason)}</div>`:''}<div class="muted">状态：${status(r.status)}</div>${r.submitter_id===state.user.id&&r.status==='approved'?'<button class="btn primary full" id="buy" style="margin-top:15px">标记为已购买</button>':''}${r.submitter_id===state.user.id&&r.status==='rejected'?'<button class="btn secondary full" id="again" style="margin-top:15px">重新提交</button>':''}`);$('#buy')?.addEventListener('click',()=>purchased(r));$('#again')?.addEventListener('click',()=>resubmit(r))}
function purchased(r){modal(`<h2>实际购买价格</h2><input class="input" id="actual" value="${r.price}" inputmode="decimal"><button class="btn primary full" id="bgo" style="margin-top:12px">确认</button>`);$('#bgo').onclick=async()=>{let p=Number($('#actual').value);if(!Number.isFinite(p))return toast('请输入有效价格');if(supabase)await supabase.from('purchase_requests').update({status:'purchased',actual_price:p,purchased_at:now()}).eq('id',r.id);else{let d=demo(),x=d.requests.find(x=>x.id===r.id);x.status='purchased';x.actual_price=p;saveDemo(d)}document.querySelectorAll('.modal-bg').forEach(x=>x.remove());await refresh();render()}}
function resubmit(r){modal(`<h2>重新提交</h2><input class="input" id="np" value="${r.price}" inputmode="decimal"><textarea class="textarea" id="nr" style="margin-top:10px">${esc(r.reason)}</textarea><button class="btn primary full" id="ago" style="margin-top:10px">重新提交审批</button>`);$('#ago').onclick=async()=>{let p=Number($('#np').value),reason=$('#nr').value.trim();if(!Number.isFinite(p)||!reason)return toast('请填写完整');if(supabase)await supabase.from('purchase_requests').update({price:p,reason,status:'pending',reject_reason:null,decided_at:null}).eq('id',r.id);else{let d=demo(),x=d.requests.find(x=>x.id===r.id);Object.assign(x,{price:p,reason,status:'pending',reject_reason:''});saveDemo(d)}document.querySelectorAll('.modal-bg').forEach(x=>x.remove());await refresh();render()}}
function cloud(){let c=cfg()||{};modal(`<h2>云端设置</h2><p class="muted">填写 Supabase Project URL 和 anon / publishable key。不要填写 service_role。</p><div class="field"><label>Project URL</label><input class="input" id="url" value="${esc(c.url||'')}"></div><div class="field"><label>anon / publishable key</label><textarea class="textarea" id="key">${esc(c.key||'')}</textarea></div><button class="btn primary full" id="save">保存并重启</button>`);$('#save').onclick=()=>{let url=$('#url').value.trim(),key=$('#key').value.trim();if(!url.startsWith('https://')||key.length<20)return toast('请检查 URL 和 key');localStorage.setItem(CFG,JSON.stringify({url,key}));location.reload()}}
function modal(h){let w=document.createElement('div');w.className='modal-bg';w.innerHTML=`<div class="modal">${h}<button class="btn secondary full" data-close style="margin-top:12px">关闭</button></div>`;document.body.append(w);w.querySelector('[data-close]').onclick=()=>w.remove();w.onclick=e=>{if(e.target===w)w.remove()}}
document.addEventListener('click',e=>{let f=e.target.closest('[data-f]');if(f){state.filter=f.dataset.f;render()}});init().catch(e=>{console.error(e);toast('连接失败：'+e.message);onboarding()});setInterval(()=>{if(supabase&&state.room&&document.visibilityState==='visible')refresh().then(render).catch(()=>{})},10000);
</script></body></html>
